<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">

<body class="dreamy-bg">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="blog.html">Love Notes</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="contact-section">
        <h1>Send me a secret love letter 💫</h1>
        <form id="contactForm">
            <input type="text" id="contactName" placeholder="Your Name" required>
            <textarea id="contactMsg" placeholder="Your message..." required></textarea>
            <button type="submit">Send</button>
        </form>
        <p class="contact-hint" id="contactSent">(This message will appear below!)</p>
        <div id="contactInbox"></div>
    </section>
    <footer>
        <small>
            Waiting for your words. &copy; 2025
        </small>
    </footer>
    <script src="script.js"></script>
</body>
