<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Board — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="notes-section">
            <h1 class="page-title">Freedom Board</h1>
            <p id="currentUserBoard"></p>
            <form id="boardForm" class="contact-section">
                <input type="text" id="boardNote" placeholder="Share your thoughts..." required aria-label="Your message">
                <button type="submit">Post</button>
            </form>
            <div id="boardNotes" role="feed" aria-label="Board notes"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
