<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="contact-section">
            <h1 class="page-title">Send me a secret love letter</h1>
            <form id="contactForm">
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName" placeholder="Your Name" required>
                <label for="contactMsg">Your message</label>
                <textarea id="contactMsg" placeholder="Your message..." rows="4" required></textarea>
                <button type="submit">Send</button>
            </form>
            <p class="contact-hint" id="contactSent"></p>
            <div id="contactInbox" role="feed" aria-label="Contact messages"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
