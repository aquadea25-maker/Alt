<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="countdown-section">
            <h1 class="page-title">Our Love Timeline</h1>
            <div class="countdown-card">
                <h2>Since the day we started</h2>
                <div id="timeTogether" class="time-grid" role="timer" aria-label="Time together"></div>
            </div>
            <div class="countdown-card">
                <h2>Next Monthsarry</h2>
                <div id="nextMonthsarry" class="time-grid" role="timer" aria-label="Next monthsarry countdown"></div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
