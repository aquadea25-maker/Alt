<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Notes — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="notes-section">
            <h1 class="page-title">Love Notes</h1>
            <p class="gallery-hint">Write freely from the heart. Your note will be saved for both of you to read.</p>
            <div class="note-compose">
                <form id="noteForm">
                    <label for="noteTitle">Title (optional)</label>
                    <input type="text" id="noteTitle" placeholder="Title (optional)" maxlength="100">
                    <label for="noteBody">Your note</label>
                    <textarea id="noteBody" placeholder="Write your love note here..." rows="6" required></textarea>
                    <button type="submit">Post Love Note</button>
                </form>
                <p id="noteMsg" class="upload-msg"></p>
            </div>
            <div id="notesList" role="feed" aria-label="Love notes"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
