<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

<body class="dreamy-bg">
    <nav>
        <ul>

    <section class="notes-section">
        <h1 class="page-title">Love Notes</h1>
        <p class="gallery-hint">Write freely from the heart. Your note will be saved for both of you to read.</p>
        <div class="note-compose">
            <form id="noteForm">
                <input type="text" id="noteTitle" placeholder="Title (optional)" maxlength="100">
                <textarea id="noteBody" placeholder="Write your love note here..." rows="6" required></textarea>
                <button type="submit">Post Love Note</button>
            </form>
            <p id="noteMsg" class="upload-msg"></p>
        </div>
        <div id="notesList"></div>
    </section>
