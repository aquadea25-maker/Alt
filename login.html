<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="login-container">
            <h1 class="page-title">Welcome Back</h1>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Your username">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
                <button type="submit" id="loginBtn">Enter the Dream Portal</button>
            </form>

            <!-- Divider -->
            <div class="login-divider"><span>or</span></div>

            <!-- Signup Form -->
            <form id="signupForm" class="login-form" style="display:none;">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" name="username" required autocomplete="username" placeholder="Choose a username">
                <label for="signupDisplayName">Display Name</label>
                <input type="text" id="signupDisplayName" name="display_name" autocomplete="name" placeholder="How should we call you?">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" name="password" required autocomplete="new-password" placeholder="Choose a password (4+ chars)">
                <label for="signupConfirmPassword">Confirm Password</label>
                <input type="password" id="signupConfirmPassword" name="confirm_password" required autocomplete="new-password" placeholder="Confirm your password">
                <button type="submit" id="signupBtn">Create My Account</button>
            </form>

            <!-- Toggle between login and signup -->
            <p class="login-toggle-text">
                <span id="togglePrompt">New here?</span>
                <button type="button" id="toggleAuthBtn" class="toggle-auth-btn">Create an Account</button>
            </p>

            <!-- Show available accounts -->
            <div id="accountList" class="account-list"></div>

            <p id="loginMessage"></p>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
