<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamy Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dreamy-bg">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" id="loginLink">Login</a></li>
            <li><a href="freedomboard.html">Freedom Board</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="blog.html">Love Notes</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="countdown.html">Countdown</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="#" id="logoutBtn" style="display:none">Logout</a></li>
        </ul>
    </nav>
    <section>
        <h1 class="page-title">Our Memories</h1>
        <p class="gallery-hint">Click any photo to see it bigger. Upload your own below!</p>
        <div class="upload-box" id="uploadBox">
            <h2>Add a Photo</h2>
            <form id="uploadForm">
                <input type="file" id="photoFile" accept="image/*" required>
                <input type="text" id="photoCaption" placeholder="Add a caption (optional)" maxlength="200">
                <button type="submit">Upload Photo</button>
            </form>
            <p id="uploadMsg" class="upload-msg"></p>
        </div>
        <div class="gallery" id="galleryGrid"></div>
    </section>
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="Enlarged photo">
        <p id="lightboxCaption" class="lightbox-caption"></p>
    </div>
    <footer>
        <small>
            These memories are only ours. &copy; 2025
        </small>
    </footer>
    <script type="module" src="script.js"></script>
</body>
</html>
