<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section>
            <h1 class="page-title">Our Memories</h1>
            <p class="gallery-hint">Click any photo to see it bigger. Upload your own below!</p>
            <div class="upload-box" id="uploadBox">
                <h2>Add a Photo</h2>
                <form id="uploadForm">
                    <label for="photoFile">Choose a photo</label>
                    <input type="file" id="photoFile" accept="image/*" required>
                    <label for="photoCaption">Caption (optional)</label>
                    <input type="text" id="photoCaption" placeholder="Add a caption (optional)" maxlength="200">
                    <button type="submit">Upload Photo</button>
                </form>
                <p id="uploadMsg" class="upload-msg"></p>
            </div>
            <div class="gallery" id="galleryGrid" role="list" aria-label="Photo gallery"></div>
        </section>

        <div id="lightbox" class="lightbox" role="dialog" aria-label="Photo viewer" aria-modal="true">
            <button class="lightbox-close" aria-label="Close photo viewer">&times;</button>
            <img id="lightboxImg" src="" alt="Enlarged photo">
            <p id="lightboxCaption" class="lightbox-caption"></p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
