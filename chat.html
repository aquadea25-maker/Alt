<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Alt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dreamy-bg">
    <div id="nav-placeholder"></div>

    <main>
        <section class="chat-section">
            <h1 class="page-title">Our Chat</h1>

            <!-- Partner selector -->
            <div class="chat-partner-bar">
                <span>Chatting with:</span>
                <select id="partnerSelect" aria-label="Select chat partner"></select>
                <span id="partnerStatus" class="partner-status"></span>
            </div>

            <div class="chat-box" id="chatBox" role="log" aria-label="Chat messages"></div>
            <form id="chatForm" class="chat-input-row">
                <label for="chatInput" class="sr-only">Type a message</label>
                <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" required aria-label="Type a message">
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
